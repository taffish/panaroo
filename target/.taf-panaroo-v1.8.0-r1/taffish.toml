[package]
name = "panaroo"
kind = "tool"
version = "1.8.0"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/panaroo"

[command]
name = "taf-panaroo"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/panaroo:1.8.0-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["pangenomics", "comparative-genomics", "genome-annotation", "quality-control"]
keywords = ["Panaroo", "bacterial pangenome", "GFF3", "GenBank", "Prokka", "Bakta", "CD-HIT", "Mash", "MAFFT", "PRANK", "Clustal Omega", "MUSCLE", "FAMSA"]
description = "Panaroo 1.8.0 for bacterial pangenome graph construction, cleaning, alignment, QC, integration, and downstream export."

[upstream]
name = "Panaroo"
type = "github"
repo = "gtonkinhill/panaroo"
homepage = "https://gtonkinhill.github.io/panaroo/"
manual = "https://gtonkinhill.github.io/panaroo/#/gettingstarted/quickstart"
release_url = "https://github.com/gtonkinhill/panaroo/releases/tag/v1.8.0"
downloads = "https://codeload.github.com/gtonkinhill/panaroo/tar.gz/refs/tags/v1.8.0"
version = "1.8.0"
commit = "e96b4978327536256b5c663f741138fc7aabed64"
license = "MIT"
citation = "Tonkin-Hill G et al. Producing polished prokaryotic pangenomes with the Panaroo pipeline. Genome Biology 21, 180 (2020)."
doi = "10.1186/s13059-020-02090-4"
pmid = "32698896"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 900
exist = ["panaroo", "run_prokka", "panaroo-qc", "panaroo-merge", "panaroo-plot-abundance", "panaroo-spydrpick", "panaroo-img", "panaroo-fmg", "panaroo-msa", "panaroo-gene-neighbourhood", "panaroo-integrate", "panaroo-filter-pa", "panaroo-generate-gffs", "panaroo-extract-gene", "panaroo-convert-bakta-to-prokka-gff", "panaroo-smoke", "cd-hit", "cd-hit-est", "mafft", "prank", "clustalo", "muscle", "famsa", "mash", "prokka", "prodigal", "barrnap", "minced", "python3", "bash", "sh", "grep", "sed", "sha256sum"]
test = ["panaroo-smoke identity", "panaroo-smoke interfaces", "panaroo-smoke core", "panaroo-smoke aligners", "panaroo-smoke formats", "panaroo-smoke qc", "panaroo-smoke prokka"]
